name: Deploy site to GitHub Pages

# tex/*.tex を唯一の source とし、push のたびに
# tex → content/*.md → *.html を生成して GitHub Pages へ公開する。
# 生成物はリポジトリに commit せず、ここで都度ビルドする。
#
# 初回のみ、リポジトリの Settings → Pages → Build and deployment → Source を
# 「GitHub Actions」に設定すること。

on:
  push:
    branches: [main]
    paths:
      - "tex/**"
      - "site.config.mjs"
      - "site-demos.mjs"
      - "site-assets/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを直列化（古いランは取り消す）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # --strict は未解決の \ref や未変換マクロがあればここで失敗させる
      - name: Build site
        run: |
          node tools/site/tex2md.mjs . --strict
          node tools/site/build.mjs .

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
